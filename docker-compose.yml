# Local test of the two images, before involving Jenkins or Kubernetes.
#   docker compose up --build      then open http://localhost:8000
services:
  # Same name as the Kubernetes Service, so frontend/nginx.conf works in both places.
  backend-service:
    build:
      context: ./backend
      args:
        APP_VERSION: local
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local
    ports:
      - "8000:80"
    depends_on:
      - backend-service
